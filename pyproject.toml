[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-string-iv-faults"
version = "0.1.0"
description = "Separating shorted bypass diodes, PID shunt loss, series resistance, obstacle shading and soiling from 15-minute inverter MPPT voltage and current, scored on held-out synthetic inverters generated by a sub-string single-diode model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pv-iv-faults = "pv_iv_faults.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
